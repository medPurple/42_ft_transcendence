# VPS deployment variant — optimized for 8 GB RAM.
# Usage: make vps  (or docker compose --env-file .env.vps -f docker-compose.vps.yml up -d --pull never)
#
# Memory budget (approximate):
#   nginx        200 MB   vault        100 MB
#   postgres     150 MB   jwtoken       80 MB
#   user         180 MB   chat         180 MB
#   game3d       180 MB   pokemap      180 MB
#   prometheus   100 MB   grafana      150 MB
#   Total ≈ 1.5 GB  →  leaves ~6.5 GB free

networks:
  microservices:
    external: true

secrets:
  vault_token_nginx:
    file: ./secrets/tokens/nginx.token
  vault_token_user:
    file: ./secrets/tokens/user.token
  vault_token_jwtoken:
    file: ./secrets/tokens/jwtoken.token
  vault_token_game3d:
    file: ./secrets/tokens/game3d.token
  vault_token_chat:
    file: ./secrets/tokens/chat.token
  vault_token_pokemap:
    file: ./secrets/tokens/pokemap.token

volumes:
  secret_volume:
  postgres_data:
  frontend:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './services/nginx/frontend/'
  pongapp:
    driver: local
    driver_opts:
      type: 'none'
      o: 'bind'
      device: './services/backend/game3d/tools/game3d/'
  prom_data:
  graf_data:
  letsencrypt:

services:
  postgres:
    container_name: postgres
    build: services/postgres
    image: postgres-multi
    networks:
      - microservices
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
      # Tune for low-memory VPS
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c max_connections=50
      -c effective_cache_size=256MB
    secrets:
      - vault_token_user
      - vault_token_chat
      - vault_token_game3d
      - vault_token_pokemap
    mem_limit: 192m
    restart: unless-stopped

  nginx:
    container_name: nginx
    networks:
      - microservices
    build:
      context: services/nginx
      dockerfile: Dockerfile.vps
    image: nginx-vps
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - letsencrypt:/etc/letsencrypt
    environment:
      - DOMAIN=${DOMAIN:?Set DOMAIN in .env.vps}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
    secrets:
      - vault_token_nginx
    healthcheck:
      disable: true
    mem_limit: 256m
    restart: unless-stopped

  user:
    container_name: user
    user: root
    networks:
      - microservices
    build: services/backend/user
    image: user
    expose:
      - "4430"
    environment:
      - DJANGO_DEBUG=False
      - DOMAIN=${DOMAIN}
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-}
      - DB_HOST=postgres
    secrets:
      - vault_token_user
    depends_on:
      - postgres
    mem_limit: 220m
    restart: unless-stopped

  token:
    container_name: jwtoken
    networks:
      - microservices
    build: services/backend/JWToken
    image: jwtoken
    expose:
      - "4430"
    environment:
      - DJANGO_DEBUG=False
    secrets:
      - vault_token_jwtoken
    mem_limit: 128m
    restart: unless-stopped

  game3d:
    container_name: game3d
    user: root
    networks:
      - microservices
    build: services/backend/game3d
    image: game3d
    expose:
      - "4430"
    environment:
      - DJANGO_DEBUG=False
      - DB_HOST=postgres
    secrets:
      - vault_token_game3d
    depends_on:
      - postgres
    mem_limit: 220m
    restart: unless-stopped

  pokemap:
    container_name: pokemap
    networks:
      - microservices
    build: services/backend/pokemap
    image: pokemap
    expose:
      - "4430"
    environment:
      - DJANGO_DEBUG=False
      - DB_HOST=postgres
    secrets:
      - vault_token_pokemap
    depends_on:
      - postgres
    mem_limit: 220m
    restart: unless-stopped

  chat:
    container_name: chat
    user: root
    networks:
      - microservices
    build: services/backend/chat
    image: chat
    expose:
      - "4430"
    environment:
      - DJANGO_DEBUG=False
      - DB_HOST=postgres
    secrets:
      - vault_token_chat
    depends_on:
      - postgres
    mem_limit: 220m
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - letsencrypt:/etc/letsencrypt
    networks:
      - microservices
    entrypoint: >
      certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email ${CERTBOT_EMAIL:?Set CERTBOT_EMAIL in .env.vps}
      --agree-tos --no-eff-email
      -d ${DOMAIN}

  prometheus:
    image: prom/prometheus
    user: root
    container_name: prometheus
    command:
      - '--config.file=/tmp/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - microservices
    restart: unless-stopped
    mem_limit: 128m
    volumes:
      - ./prometheus:/tmp/prometheus
      - prom_data:/prometheus

  grafana:
    user: root
    image: grafana/grafana
    container_name: grafana
    networks:
      - microservices
    restart: unless-stopped
    mem_limit: 192m
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set}
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml
      - ./grafana/dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
      - graf_data:/grafana
