upstream pokemapservice  { server pokemap:4430; }
upstream tokenservice    { server JWToken:4430; }
upstream userservice     { server user:4430; }
upstream chatservice     { server chat:4430; }
upstream pongservice     { server game3d:4430; }
upstream grafanaservice  { server grafana:3000; }

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${DOMAIN};

    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    server_tokens off;

    # FRONTEND_ORIGIN injecté au runtime par start.vps.sh
    set $cors_origin "${FRONTEND_ORIGIN}";

    add_header X-Frame-Options           "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Frontend statique ────────────────────────────────────────────────────
    location / {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── API : profiles / auth ────────────────────────────────────────────────
    location ~ ^/api/profiles/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://userservice;
        proxy_ssl_verify off;
    }

    location ~ ^/api/friends/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://userservice;
        proxy_ssl_verify off;
    }

    location ~ ^/api/user/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://userservice;
        proxy_ssl_verify off;
    }

    location ~ ^/api/token/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        limit_except GET OPTIONS { deny all; }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://tokenservice;
        proxy_ssl_verify off;
    }

    location ~ ^/api/chat/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://chatservice;
        proxy_ssl_verify off;
    }

    location ~ ^/api/pokemap/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://pokemapservice;
        proxy_ssl_verify off;
    }

    location ~ ^/api/pong/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://pongservice;
        proxy_ssl_verify off;
    }

    # ── Grafana ──────────────────────────────────────────────────────────────
    location /grafana/ {
        proxy_pass http://grafanaservice/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSockets ───────────────────────────────────────────────────────────
    location ~ ^/ws/friends/ {
        proxy_pass         https://userservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws/chat/ {
        proxy_pass         https://chatservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws/pokemap/ {
        proxy_pass         https://pokemapservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws/pong/ {
        proxy_pass         https://pongservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
