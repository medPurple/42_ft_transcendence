upstream pokemapservice { server pokemap:4430; }
upstream tokenservice   { server JWToken:4430; }
upstream userservice    { server user:4430; }
upstream chatservice    { server chat:4430; }
upstream pongservice    { server game3d:4430; }

# Reflète l'origine exacte du requêteur — compatible credentials:include
map $http_origin $cors_origin {
    default "$http_origin";
    ""      "*";
}

server {
    listen 4430 ssl;
    listen [::]:4430 ssl;
    server_name localhost;

    ssl_certificate     /tmp/ssl.crt;
    ssl_certificate_key /tmp/ssl.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    server_tokens off;

    # ── Sécurité HTTP (pas de CORS ici — nginx n'hérite pas add_header dans les locations) ──
    add_header X-Frame-Options           "SAMEORIGIN"                        always;
    add_header X-Content-Type-Options    "nosniff"                           always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Frontend statique ────────────────────────────────────────────────────
    location / {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # ── API : profiles / auth ────────────────────────────────────────────────
    location ~ ^/api/profiles/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://userservice;
        proxy_ssl_verify off;
    }

    # ── API : friends ────────────────────────────────────────────────────────
    location ~ ^/api/friends/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://userservice;
        proxy_ssl_verify off;
    }

    # ── API : user (info, etc.) ──────────────────────────────────────────────
    location ~ ^/api/user/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://userservice;
        proxy_ssl_verify off;
    }

    # ── API : token (validation JWT — GET only) ──────────────────────────────
    location ~ ^/api/token/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        limit_except GET OPTIONS { deny all; }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://tokenservice;
        proxy_ssl_verify off;
    }

    # ── API : chat ───────────────────────────────────────────────────────────
    location ~ ^/api/chat/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://chatservice;
        proxy_ssl_verify off;
    }

    # ── API : pokemap ────────────────────────────────────────────────────────
    location ~ ^/api/pokemap/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://pokemapservice;
        proxy_ssl_verify off;
    }

    # ── API : pong ───────────────────────────────────────────────────────────
    location ~ ^/api/pong/ {
        if ($request_method = 'OPTIONS') {
            include /etc/nginx/conf.d/cors.conf;
            add_header 'Content-Length' 0;
            return 204;
        }
        include /etc/nginx/conf.d/cors.conf;
        proxy_pass       https://pongservice;
        proxy_ssl_verify off;
    }

    # ── WebSockets ───────────────────────────────────────────────────────────
    location ~ ^/ws/friends/ {
        proxy_pass         https://userservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws/chat/ {
        proxy_pass         https://chatservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws/pokemap/ {
        proxy_pass         https://pokemapservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ~ ^/ws/pong/ {
        proxy_pass         https://pongservice;
        proxy_ssl_verify   off;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   Origin     '';
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
