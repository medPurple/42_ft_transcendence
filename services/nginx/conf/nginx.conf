upstream pokemapservice {
    server pokemap:4430;
}

upstream tokenservice {
    server JWToken:4430;
}

upstream userservice {
    server user:4430;
}

upstream chatservice {
    server chat:4430;
}

upstream pongservice {
    server game3d:4430;
}

server {
    listen 4430 ssl;
    listen [::]:4430 ssl;
    server_name localhost;

    # ── SSL ──────────────────────────────────────────────────────────────────
    ssl_certificate     /tmp/ssl.crt;
    ssl_certificate_key /tmp/ssl.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;

    # Masquer la version nginx
    server_tokens off;

    # ── WAF ModSecurity ───────────────────────────────────────────────────────
    # Géré au niveau http{} par l'image owasp/modsecurity-crs:nginx

    # ── Headers de sécurité HTTP ──────────────────────────────────────────────
    # Appliqués à toutes les réponses
    add_header X-Frame-Options           "SAMEORIGIN"           always;
    add_header X-Content-Type-Options    "nosniff"              always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── CORS ─────────────────────────────────────────────────────────────────
    # Pour une MEP avec frontend séparé, remplacer '*' par l'URL du frontend :
    #   add_header 'Access-Control-Allow-Origin' 'https://votre-frontend.com' always;
    #
    # Authorization est requis pour les requêtes JWT cross-origin.

    # Gestion des requêtes OPTIONS (preflight CORS)
    # Le navigateur envoie une requête OPTIONS avant toute requête non-simple
    # (ex: POST avec Authorization header). Sans ce bloc, CORS échoue.
    location = /cors-preflight {
        # Ce bloc ne sera jamais atteint directement — voir les blocs ci-dessous
        return 204;
    }

    # ── Frontend statique ─────────────────────────────────────────────────────
    location / {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
        proxy_cookie_path / "/; secure";
    }

    # ── API REST ──────────────────────────────────────────────────────────────

    location ~ /api/profiles/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }
        proxy_pass        https://userservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
    }

    location ~ /api/friends/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }
        proxy_pass        https://userservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
    }

    location ~ /api/chat/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }
        proxy_pass        https://chatservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
    }

    location ~ /api/pokemap/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }
        proxy_pass        https://pokemapservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
    }

    # /api/token/ POST est interne — seul GET exposé (validation de token)
    location ~ /api/token/ {
        limit_except GET {
            deny all;
        }
        proxy_pass        https://tokenservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
    }

    location ~ /api/pong/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
            add_header 'Access-Control-Max-Age'       86400;
            add_header 'Content-Length'               0;
            return 204;
        }
        proxy_pass        https://pongservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-CSRFToken' always;
    }

    # ── WebSockets ────────────────────────────────────────────────────────────

    location ~ /ws/friends/ {
        proxy_pass        https://userservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header Origin     '';
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $server_name;
    }

    location ~ /ws/chat/ {
        proxy_pass        https://chatservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header Origin     '';
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $server_name;
    }

    location ~ /ws/pokemap/ {
        proxy_pass        https://pokemapservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header Origin     '';
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $server_name;
    }

    location ~ /ws/pong/ {
        proxy_pass        https://pongservice;
        proxy_ssl_verify  off;
        proxy_cookie_path / "/; secure";
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_set_header Origin     '';
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $server_name;
    }
}
