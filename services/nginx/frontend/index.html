<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Transcendence</title>

	<!-- Chemins absolus — évite les ambiguïtés selon la route SPA active -->
	<link rel="stylesheet" href="/css/style.css"/>
	<link rel="icon" href="/images/Favicons/favicon.png"/>

	<!-- Bootstrap CSS -->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">

	<!-- Backend URL for cross-origin deployments (Cloudflare Pages → VPS).
	     start.vps.sh replaces this line at container startup.
	     Leave empty for same-origin (local dev / all-on-VPS). -->
	<script>window.__BACKEND_URL__ = "https://57.129.110.160:4430";</script>

	<!-- Three.js (ES module via importmap) -->
	<script type="importmap">
		{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.148.0/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.148.0/examples/jsm/"
		}
		}
	</script>

	<!-- Bootstrap JS -->
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous" defer></script>
	<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous" defer></script>

	<!-- Router SPA -->
	<script type="module" src="/js/main.js"></script>
</head>

<body>
	<header>
		<nav id="navbar" class="navbar navbar-expand-md hidden">
			<div class="container">
				<!-- data-link : intercepté par le router SPA (pas de rechargement) -->
				<a class="navbar-brand" href="/home" data-link>
					<img src="/images/Logos/LogoSG-mod.png" alt="logo" width="75" height="40" class="d-inline-block align-text-top">
				</a>
				<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
					<span class="navbar-toggler-icon"></span>
				</button>
				<div class="collapse navbar-collapse" id="navbarSupportedContent">
					<ul class="navbar-nav me-auto mb-2 mb-lg-0">
						<li class="nav-item">
							<a class="nav-link" href="/home" data-link>Home</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/about" data-link>About</a>
						</li>
						<li class="nav-item">
							<a class="nav-link" href="/contact" data-link>Contact</a>
						</li>
						<li class="nav-item dropdown">
							<a class="nav-link dropdown-toggle" id="navbar-dropdown-button" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
								User
							</a>
							<ul class="dropdown-menu" id="navbar-dropdown-menu"></ul>
						</li>
					</ul>
				</div>
			</div>
		</nav>
	</header>

	<main id="app"></main>

	<footer id="custom-footer" class="fixed-bottom hidden">
		<a href="/contact" data-link>© 2024 La pat patrouille</a>
	</footer>
</body>
</html>
